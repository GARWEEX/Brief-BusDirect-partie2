<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect - Trajets</title>
    <link rel="icon" type="image/jpeg" href="img/image.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/main-trajets.js"></script>
</head>

<body class="min-h-screen font-sans bg-gray-50">
    <header class="bg-blue-600 text-white w-full flex flex-col md:flex-row items-center justify-around py-5 gap-3">
        <div>
            <h1 class="text-xl font-bold">BusDirect</h1>
        </div>
        <h2 class="px-3 py-1 font-semibold rounded text-center">Réseau national</h2>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="index.html" class="text-white text-lg px-4 underline">Trajets</a></li>
            </ul>
        </nav>
    </header>
    <main class="max-w-6xl mx-auto p-4 sm:p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Nos trajets</h2>
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
            <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                <p class="text-gray-500">Nombre de trajets</p>
                <p id="totalTrips" class="text-2xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                <p class="text-gray-500">Passagers du réseau</p>
                <p id="totalPassengers" class="text-2xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                <p class="text-gray-500">Recette totale</p>
                <p id="totalRevenue" class="text-2xl font-bold text-blue-600">0 DH</p>
            </div>
        </section>
        <section class="bg-white border border-gray-200 rounded-lg p-4 mb-5 flex flex-col sm:flex-row gap-3">
            <label class="sr-only" for="searchTrip">Rechercher une ville</label><input id="searchTrip" type="search"
                placeholder="Rechercher une ville..." class="border border-gray-300 rounded p-2 w-full">
            <label class="sr-only" for="statusFilter">Statut</label><select id="statusFilter"
                class="border border-gray-300 rounded p-2">
                <option value="all">Tous les statuts</option>
                <option value="available">Disponible</option>
                <option value="full">Complet</option>
            </select>
        </section>
        <p id="resultCount" class="text-sm text-gray-600 mb-3" aria-live="polite"></p>
        <div id="listeTrajets" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-6"></div>
        <div id="pageMessage" class="text-center text-red-600 mt-3" role="status"></div>
    </main>
    <footer class="bg-blue-600 text-white text-center py-4">
        <p>&copy; BusDirect - Tous droits réservés</p>
    </footer>
</body>

</html>
