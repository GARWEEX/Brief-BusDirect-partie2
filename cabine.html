<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect - Cabine</title>
    <link rel="icon" type="image/jpeg" href="img/image.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/main-cabine.js"></script>
</head>

<body class="min-h-screen font-sans bg-gray-50">
    <header class="bg-blue-600 text-white w-full flex flex-col md:flex-row items-center justify-around py-5 gap-3">
        <div>
            <h1 class="text-xl font-bold">BusDirect</h1>
        </div>
        <h2 class="px-3 py-1 font-semibold rounded text-center">Gestion des réservations</h2>
        <nav><a href="index.html" class="text-white text-lg underline">← Trajets</a></nav>
    </header>
    <main class="max-w-6xl mx-auto p-4 sm:p-6">
        <div id="tripInfo" class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-5"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <section class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                <h2 class="text-xl font-bold mb-3">Plan de la cabine</h2>
                <div class="flex flex-wrap gap-3 text-sm mb-4"><span>🟦 Libre (non VIP)</span><span>🟨 VIP (sièges
                        01–04)</span><span>🟥 Occupé</span></div>
                <div id="planBus" class="grid grid-cols-4 gap-2"></div>
                <p id="seatMessage" class="mt-3 text-sm" role="status"></p>
            </section>
            <div class="flex flex-col gap-5">
                <section class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xl font-bold mb-3">Réserver une place</h2>
                    <form id="reserveForm" class="flex flex-col gap-3">
                        <div><label for="reserveName" class="block mb-1">Nom complet</label><input id="reserveName"
                                type="text" autocomplete="name" aria-describedby="reserveNameError"
                                class="border rounded p-2 w-full" required>
                            <p id="reserveNameError" class="text-red-600 text-sm"></p>
                        </div>
                        <div><label for="reservePhone" class="block mb-1">Téléphone</label><input id="reservePhone"
                                type="tel" inputmode="numeric" autocomplete="tel" pattern="0[67][0-9]{8}"
                                aria-describedby="reservePhoneError" class="border rounded p-2 w-full" required>
                            <p id="reservePhoneError" class="text-red-600 text-sm"></p>
                        </div>
                        <div><label for="reserveSeat" class="block mb-1">Siège (facultatif)</label><select
                                id="reserveSeat" class="border rounded p-2 w-full">
                                <option value="">Premier siège libre non VIP</option>
                            </select></div>
                        <button class="bg-blue-600 text-white rounded p-2 hover:bg-blue-700">Réserver</button>
                        <p id="reserveMessage" role="status" class="text-sm"></p>
                    </form>
                </section>
                <section class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xl font-bold mb-3">Modifier une réservation</h2>
                    <form id="editForm" class="flex flex-col gap-3">
                        <div><label for="editPassenger" class="block mb-1">Passager</label><select id="editPassenger"
                                class="border rounded p-2 w-full">
                                <option value="">Choisir un passager</option>
                            </select></div>
                        <div><label for="editName" class="block mb-1">Nom</label><input id="editName" type="text"
                                autocomplete="name" aria-describedby="editNameError" class="border rounded p-2 w-full">
                            <p id="editNameError" class="text-red-600 text-sm"></p>
                        </div>
                        <div><label for="editPhone" class="block mb-1">Téléphone</label><input id="editPhone" type="tel"
                                inputmode="numeric" autocomplete="tel" pattern="0[67][0-9]{8}"
                                aria-describedby="editPhoneError" class="border rounded p-2 w-full">
                            <p id="editPhoneError" class="text-red-600 text-sm"></p>
                        </div>
                        <div><label for="editSeat" class="block mb-1">Siège</label><select id="editSeat"
                                class="border rounded p-2 w-full"></select></div>
                        <button class="bg-blue-600 text-white rounded p-2 hover:bg-blue-700">Enregistrer les
                            modifications</button>
                        <p id="editMessage" role="status" class="text-sm"></p>
                    </form>
                </section>
                <section class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xl font-bold mb-3">Annuler une réservation</h2>
                    <form id="cancelForm" class="flex flex-col gap-3"><label
                            for="cancelPassenger">Passager</label><select id="cancelPassenger"
                            class="border rounded p-2 w-full">
                            <option value="">Choisir un passager</option>
                        </select><button class="bg-red-600 text-white rounded p-2 hover:bg-red-700">Annuler</button>
                        <p id="cancelMessage" role="status" class="text-sm"></p>
                    </form>
                </section>
                <section class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                    <h2 class="text-xl font-bold mb-3">Liste d'attente</h2>
                    <form id="waitForm" class="flex flex-col gap-3">
                        <div><label for="waitName" class="block mb-1">Nom complet</label><input id="waitName"
                                type="text" autocomplete="name" aria-describedby="waitNameError"
                                class="border rounded p-2 w-full">
                            <p id="waitNameError" class="text-red-600 text-sm"></p>
                        </div>
                        <div><label for="waitPhone" class="block mb-1">Téléphone</label><input id="waitPhone" type="tel"
                                inputmode="numeric" autocomplete="tel" pattern="0[67][0-9]{8}"
                                aria-describedby="waitPhoneError" class="border rounded p-2 w-full">
                            <p id="waitPhoneError" class="text-red-600 text-sm"></p>
                        </div><button class="bg-blue-600 text-white rounded p-2 hover:bg-blue-700">Ajouter à la
                            liste</button>
                        <p id="waitMessage" role="status" class="text-sm"></p>
                    </form>
                    <ol id="waitingList" class="list-decimal pl-5 mt-3 space-y-2"></ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="bg-blue-600 text-white text-center py-4">
        <p>&copy; BusDirect - Tous droits réservés</p>
    </footer>
</body>

</html>
